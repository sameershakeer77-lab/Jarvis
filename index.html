<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>J.A.R.V.I.S. Multi-Key Rotation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #040811; color: #e2f1ff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; height: 100dvh; width: 100vw; overflow: hidden;
    }
    header {
      padding: 10px 12px; background: #091222; border-bottom: 1px solid #1b3252;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 14px; letter-spacing: 1.5px; color: #00f0ff; }
    .header-btns { display: flex; gap: 6px; }
    .small-btn {
      background: #13243a; color: #00f0ff; border: 1px solid #00f0ff;
      padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer;
    }
    #viewport {
      position: relative; flex: 1;
      background: radial-gradient(circle at center, #0d1b30 0%, #03070e 100%);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; display: none; }
    #placeholder { text-align: center; color: #7a9ec7; padding: 24px; font-size: 14px; line-height: 1.5; }
    #reactor {
      position: absolute; bottom: 14px; right: 14px; width: 56px; height: 56px;
      border-radius: 50%; background: radial-gradient(circle, #00f0ff 0%, #0044ff 65%, transparent 100%);
      border: 2px solid #00f0ff; box-shadow: 0 0 16px #00f0ff;
      display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #fff;
    }
    .speaking { animation: pulseSpeak 0.35s infinite alternate; }
    @keyframes pulseSpeak { from { transform: scale(1); } to { transform: scale(1.3); } }
    #memoryModal {
      position: fixed; inset: 0; background: rgba(3, 7, 15, 0.94);
      z-index: 100; display: none; flex-direction: column; padding: 16px;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #00f0ff; padding-bottom: 10px; margin-bottom: 10px;
    }
    .modal-header h2 { font-size: 15px; color: #00f0ff; }
    #memoryContent {
      flex: 1; overflow-y: auto; font-family: monospace; font-size: 12px;
      color: #c9e4ff; white-space: pre-wrap; background: #07101e;
      padding: 10px; border-radius: 8px; border: 1px solid #1b3252;
    }
    #controls {
      background: #091222; border-top: 2px solid #00f0ff;
      padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    input, select {
      width: 100%; background: #040811; color: #ffffff;
      border: 1px solid #233e63; padding: 9px 10px; border-radius: 7px; font-size: 13px;
    }
    button.main-btn {
      padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 700;
      border: none; cursor: pointer; background: #00f0ff; color: #040811;
    }
    button.talk-btn {
      padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 700;
      border: 1px solid #00f0ff; cursor: pointer; background: #13243a; color: #e2f1ff;
    }
    button:disabled { opacity: 0.45; }
    .danger { background: #ff3b5c !important; color: #ffffff !important; border: none !important; }
    #logBox {
      height: 80px; background: #02050a; border: 1px solid #1b3252;
      border-radius: 6px; padding: 7px; font-family: monospace;
      font-size: 11px; color: #00ff9d; overflow-y: auto; white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <header>
    <h1>J.A.R.V.I.S. MULTI-KEY</h1>
    <div class="header-btns">
      <button id="memBtn" class="small-btn">Memory (0)</button>
      <button id="flipBtn" class="small-btn">Flip Cam</button>
    </div>
  </header>

  <div id="viewport">
    <div id="placeholder">
      <b>J.A.R.V.I.S. Multi-Key Setup</b><br><br>
      • Automatic Key Rotation on 429 Limits<br>
      • Persistent Local Memory Vault<br>
      • Powered by Gemini Flash
    </div>
    <video id="camera" autoplay playsinline muted></video>
    <div id="reactor">IDLE</div>
    <canvas id="snapCanvas" style="display:none;"></canvas>
  </div>

  <div id="memoryModal">
    <div class="modal-header">
      <h2>J.A.R.V.I.S. MEMORY VAULT</h2>
      <button id="closeMemBtn" class="small-btn">Close</button>
    </div>
    <div id="memoryContent"></div>
  </div>

  <div id="controls">
    <div class="row">
      <input type="password" id="key1" placeholder="API Key 1 (Account 1)" />
      <input type="password" id="key2" placeholder="API Key 2 (Account 2)" />
    </div>
    <input type="password" id="key3" placeholder="API Key 3 (Account 3)" />
    <div class="row">
      <button id="startBtn" class="main-btn">Start Live Call</button>
      <button id="manualTalkBtn" class="talk-btn" disabled>Ask Jarvis (Type)</button>
    </div>
    <div id="logBox">Ready. Enter your 3 API keys above.</div>
  </div>

  <script>
    const videoEl = document.getElementById("camera");
    const placeholderEl = document.getElementById("placeholder");
    const canvasEl = document.getElementById("snapCanvas");
    const reactorEl = document.getElementById("reactor");
    const logBox = document.getElementById("logBox");
    const startBtn = document.getElementById("startBtn");
    const manualTalkBtn = document.getElementById("manualTalkBtn");
    const memBtn = document.getElementById("memBtn");
    const memoryModal = document.getElementById("memoryModal");
    const memoryContent = document.getElementById("memoryContent");

    const k1 = document.getElementById("key1");
    const k2 = document.getElementById("key2");
    const k3 = document.getElementById("key3");

    k1.value = localStorage.getItem("j_k1") || "";
    k2.value = localStorage.getItem("j_k2") || "";
    k3.value = localStorage.getItem("j_k3") || "";

    [k1, k2, k3].forEach((el, idx) => {
      el.addEventListener("input", () => localStorage.setItem("j_k" + (idx+1), el.value.trim()));
    });

    let fullArchive = JSON.parse(localStorage.getItem("jarvis_archive") || "[]");
    let coreFacts = JSON.parse(localStorage.getItem("jarvis_facts") || "[]");

    function updateMemoryBadge() {
      memBtn.textContent = "Memory (" + Math.floor(fullArchive.length / 2) + " chats | " + coreFacts.length + " facts)";
    }
    updateMemoryBadge();

    let currentKeyIdx = 0;
    function getActiveKeys() {
      return [k1.value.trim(), k2.value.trim(), k3.value.trim()].filter(k => k.length > 5);
    }

    function log(msg) {
      const t = new Date().toLocaleTimeString();
      logBox.textContent += "\n[" + t + "] " + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: true
        });
        videoEl.srcObject = stream;
        videoEl.style.display = "block";
        placeholderEl.style.display = "none";
        return true;
      } catch (err) {
        log("Camera Error: " + err.message);
        return false;
      }
    }

    function captureFrameBase64() {
      const ctx = canvasEl.getContext("2d");
      canvasEl.width = 480; canvasEl.height = 360;
      ctx.drawImage(videoEl, 0, 0, 480, 360);
      return canvasEl.toDataURL("image/jpeg", 0.6).split(",")[1];
    }

    // MULTI-KEY ROTATION FETCH WRAPPER
    async function fetchWithKeyRotation(payload) {
      const keys = getActiveKeys();
      if (keys.length === 0) throw new Error("Please enter at least one Google AI Studio API Key.");

      let attempts = 0;
      while (attempts < keys.length) {
        const activeKey = keys[currentKeyIdx];
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${activeKey}`;

        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (res.status === 429 || res.status === 403) {
            log(`⚠️ Key #${currentKeyIdx + 1} rate-limited (429). Rotating to next key...`);
            currentKeyIdx = (currentKeyIdx + 1) % keys.length;
            attempts++;
            continue;
          }

          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          return data;
        } catch (err) {
          if (attempts >= keys.length - 1) throw err;
          currentKeyIdx = (currentKeyIdx + 1) % keys.length;
          attempts++;
        }
      }
      throw new Error("All provided API keys are currently rate-limited.");
    }

    async function askJarvis(userText) {
      reactorEl.textContent = "THINK";
      log("You: \"" + userText + "\"");

      if (/remember |my name is |i kept /i.test(userText)) {
        coreFacts.push(userText + " (" + new Date().toLocaleDateString() + ")");
        localStorage.setItem("jarvis_facts", JSON.stringify(coreFacts));
        updateMemoryBadge();
      }

      const frameB64 = captureFrameBase64();
      const systemInstruction = "You are J.A.R.V.I.S., Tony Stark's AI. Keep replies short and sweet (1-2 sentences). Address the user as Sir.";

      const contents = [
        ...fullArchive.slice(-4).map(m => ({ role: m.role, parts: [{ text: m.content }] })),
        {
          role: "user",
          parts: [
            { text: userText },
            { inline_data: { mime_type: "image/jpeg", data: frameB64 } }
          ]
        }
      ];

      try {
        const data = await fetchWithKeyRotation({
          system_instruction: { parts: [{ text: systemInstruction }] },
          contents: contents
        });

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Right here, Sir.";
        const now = new Date().toLocaleString();
        fullArchive.push({ role: "user", content: userText, timestamp: now });
        fullArchive.push({ role: "model", content: reply, timestamp: now });
        localStorage.setItem("jarvis_archive", JSON.stringify(fullArchive));
        updateMemoryBadge();

        log("Jarvis: \"" + reply + "\"");
        speak(reply);
      } catch (err) {
        log("Error: " + err.message);
        reactorEl.textContent = "LISTEN";
      }
    }

    function speak(text) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.onstart = () => { reactorEl.textContent = "SPEAK"; reactorEl.classList.add("speaking"); };
      utter.onend = () => { reactorEl.classList.remove("speaking"); reactorEl.textContent = "LISTEN"; };
      window.speechSynthesis.speak(utter);
    }

    memBtn.onclick = () => {
      memoryContent.textContent = "=== CORE FACTS ===\n" + (coreFacts.join("\n") || "None") +
        "\n\n=== ARCHIVE ===\n" + fullArchive.map(m => m.timestamp + " " + m.role + ": " + m.content).join("\n");
      memoryModal.style.display = "flex";
    };
    document.getElementById("closeMemBtn").onclick = () => memoryModal.style.display = "none";

    manualTalkBtn.onclick = () => {
      const q = prompt("Ask Jarvis:", "Jarvis, what do you see?");
      if (q) askJarvis(q);
    };

    let isRunning = false;
    startBtn.onclick = async () => {
      if (!isRunning) {
        if (getActiveKeys().length === 0) {
          alert("Please enter at least one Google AI Studio API Key.");
          return;
        }
        const ok = await startCamera();
        if (!ok) return;
        isRunning = true;
        manualTalkBtn.disabled = false;
        startBtn.textContent = "End Call";
        startBtn.classList.add("danger");
        reactorEl.textContent = "LISTEN";
        log("Multi-Key Live Scanner Active.");
      } else {
        isRunning = false;
        manualTalkBtn.disabled = true;
        window.speechSynthesis.cancel();
        videoEl.style.display = "none";
        placeholderEl.style.display = "block";
        startBtn.textContent = "Start Live Call";
        startBtn.classList.remove("danger");
        reactorEl.textContent = "IDLE";
        log("Call ended.");
      }
    };

    document.getElementById("flipBtn").onclick = startCamera;
  </script>
</body>
</html>
